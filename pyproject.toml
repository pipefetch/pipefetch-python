[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pipefetch"
dynamic = ["version"]
description = "Public web data as JSON: video platforms, social networks and company websites through one API key. Client for the Pipefetch API."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pipefetch", email = "support@pipefetch.com" }]
keywords = ["youtube", "youtube-transcript", "youtube-api", "transcript", "captions", "subtitles", "youtube-search", "youtube-comments", "brand-api", "logo-api", "email-extractor", "website-contacts", "instagram-api", "instagram-profile", "web-data", "web-scraping", "scraper-api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://pipefetch.com"
Documentation = "https://pipefetch.com/docs"
Guides = "https://pipefetch.com/guides"
Repository = "https://github.com/pipefetch/pipefetch-python"
Issues = "https://github.com/pipefetch/pipefetch-python/issues"

[tool.hatch.version]
path = "src/pipefetch/_client.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pipefetch"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]
